<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Texas Truck Parking Dashboard</title>

  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">

  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }
  </style>

  <script src="https://js.arcgis.com/4.31/"></script>
</head>

<body>

<div id="viewDiv"></div>

<script>
require([
  "esri/Map",
  "esri/views/MapView"
], (Map, MapView) => {

  const map = new Map({
    basemap: "streets"
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    center: [-99, 31],
    zoom: 6
  });

});
</script>

</body>
</html>
