<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Texas Truck Parking Dashboard</title>

  <link rel="stylesheet"
        href="https://js.arcgis.com/4.31/esri/themes/light/main.css">

  <style>
    html, body, #viewDiv {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="https://js.arcgis.com/4.31/"></script>
</head>

<body>

<div id="viewDiv"></div>

<script>
require([
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer"
], function(Map, MapView, FeatureLayer) {

  const truckLayer = new FeatureLayer({
    url: "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/Truck_Parking_Inventory/FeatureServer/2",
    outFields: ["*"],
    popupTemplate: {
      title: "{CITY_NM}",
      content: `
        <b>County:</b> {CNTY_NM}<br>
        <b>District:</b> {DIST_NM}<br>
        <b>Parking Spaces:</b> {INV_SPC_CT}<br>
        <b>Ownership:</b> {OWNERSHIP}<br>
        <b>Nearest Interstate:</b> {NEAREST_IH}<br>
        <b>24 Hour:</b> {OPENTWNTYFOURHOUR}<br>
        <b>Repair Facilities:</b> {REPAIRFACILITIES}<br>
        <b>Heavy Duty Fuel:</b> {HEAVYDUTYLIQUIDFUEL}<br>
        <b>Heavy Duty EV:</b> {HEAVYDUTY_EVCHARGE}
      `
    }
  });

  const map = new Map({
    basemap: "streets-navigation-vector",
    layers: [truckLayer]
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    center: [-99, 31],
    zoom: 6
  });



  });
</script>

</body>
</html>
