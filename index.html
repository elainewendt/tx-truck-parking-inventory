<script>

require([
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer"
], function (Map, MapView, FeatureLayer) {

  const truckLayer = new FeatureLayer({

    url: "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/Truck_Parking_Inventory/FeatureServer/2",

    outFields: ["*"],

    popupTemplate: {
      title: "{CITY_NM}",
      content: `
        <b>County:</b> {CNTY_NM}<br>
        <b>District:</b> {DIST_NM}<br>
        <b>Parking Spaces:</b> {Parking_Inventory}<br>
        <b>Ownership:</b> {OWNERSHIP}<br>
        <b>Nearest Interstate:</b> {NEAREST_IH}<br>
        <b>24 Hour:</b> {OPENTWNTYFOURHOUR}<br>
        <b>Repair Facilities:</b> {REPAIRFACILITIES}<br>
        <b>Heavy Duty Fuel:</b> {HEAVYDUTYLIQUIDFUEL}<br>
        <b>Heavy Duty EV:</b> {HEAVYDUTY_EVCHARGE}
      `
    }

  });

  truckLayer.when(function() {
    console.log("Layer loaded");
    console.log("Full extent:", truckLayer.fullExtent);
  });

  truckLayer.queryFeatureCount()
    .then(function(count) {
      console.log("Feature count:", count);
    })
    .catch(function(error) {
      console.error("Query error:", error);
    });

  const map = new Map({
    basemap: "hybrid",
    layers: [truckLayer]
  });

  const view = new MapView({
    container: "viewDiv",
    map: map
  });

  view.when(async () => {

    const extent = await truckLayer.queryExtent();

    console.log(extent);

    if (extent.extent) {
      view.goTo(extent.extent.expand(1.2));
    }

  });

  truckLayer.when(async () => {

    document.getElementById("status").innerHTML =
      "Layer Loaded";

    try {

      const count =
        await truckLayer.queryFeatureCount();

      document.getElementById("facilityCount").innerHTML =
        count.toLocaleString();

      const results =
        await truckLayer.queryFeatures({
          where: "1=1",
          outFields: ["Parking_Inventory"],
          returnGeometry: false
        });

      let totalSpaces = 0;

      results.features.forEach(f => {
        totalSpaces +=
          f.attributes.Parking_Inventory || 0;
      });

      document.getElementById("spaceCount").innerHTML =
        totalSpaces.toLocaleString();

      await view.goTo(truckLayer.fullExtent);

      console.log(
        "Feature count:",
        count
      );

    }
    catch (err) {

      console.error(err);

      document.getElementById("status").innerHTML =
        "Query Error";

    }

  }).catch(err => {

    console.error(err);

    document.getElementById("status").innerHTML =
      "Layer Failed";

  });

});

</script>
