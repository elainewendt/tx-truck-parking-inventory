<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Texas Truck Parking Inventory Dashboard</title>

  <link rel="stylesheet"
        href="https://js.arcgis.com/4.31/esri/themes/light/main.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    #header {
      height: 60px;
      background: #005a9c;
      color: white;
      display: flex;
      align-items: center;
      padding-left: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    #container {
      display: flex;
      height: calc(100% - 60px);
    }

    #sidebar {
      width: 320px;
      background: #f5f5f5;
      padding: 15px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    #viewDiv {
      flex: 1;
    }

    .card {
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,.15);
    }

    .title {
      font-size: 14px;
      color: #666;
    }

    .metric {
      font-size: 30px;
      font-weight: bold;
      color: #005a9c;
    }
  </style>

  <script src="https://js.arcgis.com/4.31/"></script>
</head>

<body>

<div id="header">
  Texas Truck Parking Inventory Dashboard
</div>

<div id="container">

  <div id="sidebar">

      <div class="title">Total Facilities</div>
