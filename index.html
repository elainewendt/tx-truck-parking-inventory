<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Texas Truck Parking Dashboard</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: Arial, sans-serif;
}

#header {
  height: 60px;
  background: #005a9c;
  color: white;
  display: flex;
  align-items: center;
  padding-left: 20px;
  font-size: 22px;
  font-weight: bold;
}

#sidebar {
  position: absolute;
  top: 80px;
  left: 20px;
  z-index: 99;
  width: 250px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}

.metric {
  font-size: 28px;
  color: #005a9c;
  font-weight: bold;
}

#viewDiv {
  height: calc(100% - 60px);
}
</style>

<script src="https://js.arcgis.com/4.31/"></script>
</head>

<body>

<div id="header">
Texas Truck Parking Inventory Dashboard
</div>

<div id="sidebar">

  <div class="card">
    <div>Total Facilities</div>
    <div id="facilityCount" class="metric">...</div>
  </div>

  <div class="card">
    <div>Total Parking Spaces</div>
    <div id="spaceCount" class="metric">...</div>
  </div>

</div>

<div id="viewDiv"></div>
