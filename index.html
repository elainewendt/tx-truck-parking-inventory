<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Texas Truck Parking Dashboard</title>

  <link rel="stylesheet"
    href="https://js.arcgis.com/4.31/esri/themes/light/main.css"/>

  <script src="https://js.arcgis.comargin:0;
      height:100%;
      font-family:Arial;
    }

    #header {
      padding:15px;
      background:#004a8f;
      color:white;
      font-size:24px;
      font-weight:bold;
    }

    #container {
      display:flex;
      height:calc(100% - 60px);
    }

    #sidebar {
      width:300px;
      padding:15px;
      overflow:auto;
      background:#f5f5f5;
    }

    #viewDiv {
      flex:1;
    }

    .card {
      background:white;
      padding:10px;
      margin-bottom:10px;
      border-radius:5px;
      box-shadow:0 2px 4px rgba(0,0,0,.2);
    }

    .value {
      font-size:28px;
      font-weight:bold;
      color:#004a8f;
    }
  </style>
</head>

<body>

<div id="header">
Texas Truck Parking Inventory Dashboard
</div>

<div id="container">

  <div id="sidebar">

    <div class="card">
      <div>Total Facilities</div>
      <div class="value" id="sites">Loading...</div>
    </div>

    <div class="card">
      <div>Total Parking Spaces</div>
      <div class="value" id="spaces">Loading...</div>
    </div>

  </div>

  <div id="viewDiv"></div>

</div>

<script>

require([
"esri/Map",
"esri/views/MapView",
"esri/layers/FeatureLayer"
], function(Map, MapView, FeatureLayer){

const layer = new FeatureLayer({
url:
"https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/Truck_Parking_Inventory/FeatureServer/2",
outFields:["*"]
});

const map = new Map({
basemap:"gray-vector",
layers:[layer]
});

const view = new MapView({
container:"viewDiv",
map:map,
center:[-99,31],
zoom:6
});

layer.queryFeatureCount()
.then(function(count){
document.getElementById("sites").innerHTML=count;
});

layer.queryFeatures({
where:"1=1",
outFields:["Parking_Inventory"],
returnGeometry:false
})
.then(function(result){

let total=0;

result.features.forEach(function(f){

total += f.attributes.Parking_Inventory || 0;

});

document.getElementById("spaces").innerHTML =
total.toLocaleString();

});

});

</script>

</body>
</html>
